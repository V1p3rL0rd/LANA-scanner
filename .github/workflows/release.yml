name: Release

# Publish a release in the GitHub UI (Releases → Draft a new release → tag vX.Y.Z → Publish)
# and this workflow builds the universal app and attaches the zip to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Unit tests
        run: swift test

      - name: Build universal app bundle
        run: |
          export VERSION="${TAG#v}"
          ./scripts/build-app.sh --universal

      - name: Package
        id: pkg
        run: |
          ZIP="LANA-Scanner-${TAG#v}-macOS.zip"
          ditto -c -k --keepParent "build/LANA Scanner.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" "${{ steps.pkg.outputs.zip }}.sha256" --clobber
