name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: swift test

      - name: Build universal app bundle
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-app.sh --universal

      - name: Package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="LANA-Scanner-${VERSION}-macOS.zip"
          ditto -c -k --keepParent "build/LANA Scanner.app" "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.zip }}" "${{ steps.pkg.outputs.zip }}.sha256" \
            --title "LANA Scanner ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Universal (Apple Silicon + Intel) build for macOS 13+. Ad-hoc signed, not notarized — see README → Install for the one-time Gatekeeper step."
