<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#123A63"/>
      <stop offset="0.55" stop-color="#0A2342"/>
      <stop offset="1" stop-color="#061427"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2FE6B0" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#2FE6B0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#2FE6B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2FE6B0" stop-opacity="0"/>
      <stop offset="1" stop-color="#2FE6B0" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="dotglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- base tile -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#squircle)">
    <circle cx="512" cy="512" r="400" fill="url(#glow)"/>

    <!-- grid rings + crosshair -->
    <g fill="none" stroke="#5FF2C8" stroke-opacity="0.28" stroke-width="5">
      <circle cx="512" cy="512" r="110"/>
      <circle cx="512" cy="512" r="215"/>
      <circle cx="512" cy="512" r="320"/>
    </g>
    <g stroke="#5FF2C8" stroke-opacity="0.16" stroke-width="4">
      <line x1="512" y1="150" x2="512" y2="874"/>
      <line x1="150" y1="512" x2="874" y2="512"/>
    </g>

    <!-- radar sweep (wedge from -95° to -35°) -->
    <g transform="rotate(-35 512 512)">
      <path d="M512 512 L832 512 A320 320 0 0 0 672 234.9 Z" fill="url(#sweep)" transform="rotate(0 512 512)" filter="url(#blur)" opacity="0.9"/>
      <line x1="512" y1="512" x2="832" y2="512" stroke="#8CFFE0" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- network links -->
    <g stroke="#9FD8FF" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round">
      <line x1="512" y1="512" x2="690" y2="330"/>
      <line x1="512" y1="512" x2="330" y2="380"/>
      <line x1="512" y1="512" x2="400" y2="690"/>
      <line x1="512" y1="512" x2="680" y2="650"/>
      <line x1="330" y1="380" x2="400" y2="690"/>
      <line x1="690" y1="330" x2="680" y2="650"/>
    </g>

    <!-- hosts -->
    <g filter="url(#dotglow)">
      <circle cx="690" cy="330" r="30" fill="#2FE6B0"/>
      <circle cx="330" cy="380" r="24" fill="#4FB4FF"/>
      <circle cx="400" cy="690" r="24" fill="#4FB4FF"/>
      <circle cx="680" cy="650" r="26" fill="#FFC24B"/>
      <circle cx="770" cy="470" r="11" fill="#2FE6B0" opacity="0.8"/>
      <circle cx="250" cy="560" r="10" fill="#4FB4FF" opacity="0.7"/>
    </g>

    <!-- center node (this Mac) -->
    <circle cx="512" cy="512" r="44" fill="#E9FFF8"/>
    <circle cx="512" cy="512" r="44" fill="none" stroke="#2FE6B0" stroke-width="10"/>

    <!-- subtle gloss -->
    <rect x="100" y="100" width="824" height="824" fill="url(#gloss)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
